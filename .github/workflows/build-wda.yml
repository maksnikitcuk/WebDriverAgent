name: Build WDA unsigned ipa
on:
  workflow_dispatch:

  jobs:
    build:
        runs-on: macos-14
            steps:
                  - name: Checkout
                          uses: actions/checkout@v4

                                - name: Build WebDriverAgentRunner (unsigned)
                                        run: |
                                                  xcodebuild build-for-testing \
                                                              -project WebDriverAgent.xcodeproj \
                                                                          -scheme WebDriverAgentRunner \
                                                                                      -destination 'generic/platform=iOS' \
                                                                                                  -derivedDataPath build \
                                                                                                              CODE_SIGNING_ALLOWED=NO
                                                                                                              
                                                                                                                    - name: Package unsigned ipa
                                                                                                                            run: |
                                                                                                                                      mkdir -p Payload
                                                                                                                                                cp -r "build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app" Payload/
                                                                                                                                                          zip -qry WebDriverAgentRunner-unsigned.ipa Payload
                                                                                                                                                          
                                                                                                                                                                - name: Upload artifact
                                                                                                                                                                        uses: actions/upload-artifact@v4
                                                                                                                                                                                with:
                                                                                                                                                                                          name: wda-ipa
                                                                                                                                                                                                    path: WebDriverAgentRunner-unsigned.ipa
                                                                                                                                                                                                    
